about:
  - "I study how machines find objects in 3D scenes and video, and where they fail. My recent work is on 3D visual grounding with vision-language models: choosing the views a model sees, and tracing which step of a pipeline causes an error."
  - "Before that I worked on 3D object detection, model compression with pruning and knowledge distillation, and video compression for machine vision at very low bitrates. I prefer results that explain a failure over results that only raise a final score."

