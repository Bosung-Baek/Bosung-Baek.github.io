# ── 연구·프로젝트 ────────────────────────────────────────────
#  metrics: 눈에 띄게 보여 줄 숫자 (최대 3개 권장)
projects:
  - title: "Relation-preserving view selection for 3D visual grounding"
    period: ""
    tags: ["3D Visual Grounding", "VLM"]
    summary: "Visibility-based view selection shows the target object large but can drop the anchor object that the query refers to. I score views by whether the target and its anchor appear together, and compare against a reproduced SeqVLM with the same Qwen2-VL-7B backbone, changing only the view selection."
    metrics:
      - value: "34.4 → 44.8"
        label: "Overall Acc@0.25 (%)"
      - value: "28.8 → 40.8"
        label: "Overall Acc@0.50 (%)"
    links: []
  - title: "Diagnosing where 3D visual grounding pipelines fail"
    period: "Ongoing"
    tags: ["3D Visual Grounding", "Evaluation"]
    summary: "Final grounding accuracy cannot tell a missing candidate from evidence that never reached the model, an invalid output, or a wrong choice. I convert the artifacts that different systems already produce into a common trace and record the earliest observable failure in each query."
    metrics: []
    links: []
  - title: "PointRefine3D: bounding box refinement for indoor 3D object detection"
    period: "M.S. thesis"
    tags: ["3D Object Detection"]
    summary: "Detectors predict loose boxes when objects sit next to each other or against walls and floors. On top of UniDet3D, without changing its backbone, I added a point-level IoU loss for training and a refinement step at inference that corrects boxes with low predicted IoU, at 1.05× the inference time. Accuracy rose on S3DIS and 3RScan and fell on ScanNetV2 (−2.0) and MultiScan (−0.7)."
    metrics:
      - value: "58.4 → 62.3"
        label: "mAP@0.5 on S3DIS"
      - value: "45.6 → 49.6"
        label: "mAP@0.5 on 3RScan"
    links: []
  - title: "SAVER: video compression for machine vision at ultra-low bitrates"
    period: ""
    tags: ["Video Coding for Machines", "Super-Resolution"]
    summary: "At 0.001 bpp, standard codecs and existing machine-oriented codecs lose the content that detection and tracking depend on. SAVER keeps a standard codec unchanged and adds object-aware downsampling before it and compression-aware reconstruction after it. Co-first author: software, experiments, validation, analysis and first draft."
    metrics:
      - value: "55.37"
        label: "detection mAP on ImageNet VID at 0.001 bpp (MPEG VCM: 31.28)"
      - value: "42.08"
        label: "tracking MOTA on MOT20 (RDVR: 34.71)"
      - value: "24.04"
        label: "CLIP-Score, video captioning"
    links: []
  - title: "Compressing ESRGAN with pruning and knowledge distillation"
    period: ""
    tags: ["Model Compression", "Super-Resolution"]
    summary: "GAN-based super-resolution models are too large for constrained devices. I prune the teacher generator first, then pass its intermediate feature maps to a narrower student through learnable 1×1 convolutions that match the channel counts."
    metrics:
      - value: "11.7M → 6.5M"
        label: "generator parameters (−44.4%)"
    links: []

